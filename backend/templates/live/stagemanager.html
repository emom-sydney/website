<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stage manager</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101418;color:#f5f7fa}*{box-sizing:border-box}body{margin:0;background:#101418}main{max-width:680px;margin:auto;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}header{padding:18px 4px 12px}h1{font-size:1.8rem;margin:0 0 4px}p{color:#aab4bf;margin:0}.card{background:#1c232b;border:1px solid #39434e;border-radius:16px;padding:14px;margin:10px 0}select,button{width:100%;min-height:52px;border-radius:12px;border:1px solid #52606d;background:#111820;color:#fff;padding:12px;font-size:1rem}button{background:#1677d2;border:0;font-weight:700;margin-top:10px}.act{display:flex;gap:10px;align-items:center;text-align:left;background:#27313b;margin-top:8px}.act.live{background:#176b48;outline:3px solid #40d890}.act small{display:block;color:#b7c3ce;margin-top:3px}.status{min-height:24px;margin:12px 4px;color:#8fe3bd}.error{color:#ff9b9b}.current{font-size:1.5rem;font-weight:700;color:#8fe3bd;margin-top:6px}.hidden{display:none}</style></head><body><main><header><h1>Stage manager</h1><p>Tap a performer to put them live. Tap again to clear.</p></header><section class="card"><label for="event">Event</label><select id="event"></select><div id="acts"></div><p id="status" class="status">Loading…</p></section></main>
<script>
const eventEl=document.querySelector('#event'),actsEl=document.querySelector('#acts'),statusEl=document.querySelector('#status');let data={now_playing:{},events:[]},csrf=document.cookie.match(/(?:^|; )emom_staff_csrf=([^;]+)/)?.[1];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,o={}){o.credentials='same-origin';o.headers={...(o.headers||{}),'Content-Type':'application/json'};if(o.method&&o.method!=='GET')o.headers['X-CSRF-Token']=decodeURIComponent(csrf||'');let r=await fetch(url,o),j=await r.json();if(!r.ok)throw Error(j.error?.message||'Request failed');return j.data}
function render(){let id=Number(eventEl.value),e=data.events.find(x=>x.event_id===id),selected=data.now_playing.profile_id;actsEl.innerHTML=(e?.performers||[]).map(x=>`<button class="act ${x.profile_id===selected?'live':''}" data-id="${x.profile_id}">${esc(x.display_name)}${x.profile_id===selected?'<small>LIVE NOW</small>':''}</button>`).join('')||'<p>No performers found for this event.</p>';actsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>save(Number(b.dataset.id)===selected?null:Number(b.dataset.id)));}
async function save(profile_id){try{data.now_playing=await api('/api/v1/admin/live/now-playing',{method:'PUT',body:JSON.stringify({event_id:Number(eventEl.value),profile_id})});statusEl.textContent=profile_id?'Live performer updated.':'Live performer cleared.';render()}catch(e){statusEl.textContent=e.message;statusEl.className='status error'}}
async function refresh({initial=false}={}){try{let previous=eventEl.value;data=await api('/api/v1/admin/live/now-playing');if(initial||!eventEl.options.length){eventEl.innerHTML=data.events.map(e=>`<option value="${e.event_id}">${esc(e.event_date)} — ${esc(e.event_name)}</option>`).join('');let current=data.now_playing.event_id;if(current)eventEl.value=current;else if(previous)eventEl.value=previous;eventEl.onchange=render}else if(previous&&data.events.some(e=>String(e.event_id)===previous)){eventEl.value=previous}render()}catch(e){if(initial){statusEl.textContent=e.message;statusEl.className='status error'}}}
refresh({initial:true});
setInterval(()=>refresh(),5000);
</script></body></html>
