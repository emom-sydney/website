<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stage manager</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101418;color:#f5f7fa}*{box-sizing:border-box}body{margin:0;background:#101418}main{max-width:680px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom))}header{padding:12px 4px}h1{font-size:1.8rem;margin:0 0 4px}p{color:#aab4bf;margin:0}.card{background:#1c232b;border:1px solid #39434e;border-radius:16px;padding:14px;margin:10px 0}select,button{border-radius:12px;border:1px solid #52606d;background:#111820;color:#fff;font:inherit}select{width:100%;min-height:52px;padding:12px;font-size:1rem}h2{font-size:1.05rem;margin:22px 0 6px}.row{display:grid;grid-template-columns:1fr 62px 62px 70px;gap:8px;align-items:center;background:#27313b;border-radius:14px;padding:8px;margin-top:8px}.row.live{outline:3px solid #40d890;background:#176b48}.performer{min-height:54px;text-align:left;padding:10px;border:0;background:transparent;font-weight:700}.performer small{display:block;color:#c2d0da;margin-top:3px;font-weight:400}.check{width:54px;height:54px;border:0;background:#34414d;font-size:1.8rem;font-weight:800}.check.checked{background:#0d9b68;color:white}.check.now{border-radius:50%;background:#34414d}.check.now.active{background:#1684dc;box-shadow:inset 0 0 0 8px #bce7ff}.check:disabled,.order button:disabled{opacity:.35}.order{display:flex;gap:4px}.order button{width:31px;height:54px;border:0;background:#34414d;font-size:1.25rem}.status{min-height:24px;margin:14px 4px;color:#8fe3bd}.error{color:#ff9b9b}.empty{padding:12px 0}.legend{display:grid;grid-template-columns:1fr 62px 62px 70px;gap:8px;color:#aab4bf;font-size:.8rem;margin:0 8px 4px;text-align:center}.legend span:first-child{text-align:left}@media(max-width:430px){.row{grid-template-columns:1fr 52px 52px 58px;gap:5px}.check{width:46px}.order button{width:26px}.legend{grid-template-columns:1fr 52px 52px 58px;gap:5px;font-size:.72rem}}
</style></head><body><main><header><h1>Stage manager</h1><p>Mark performers in as they arrive. Choose one checked-in performer as live.</p></header><section class="card"><label for="event">Event</label><select id="event"></select><h2>Roll-call</h2><div class="legend"><span>Performer</span><span>Arrived</span><span>Now playing</span><span>Order</span></div><div id="acts"></div><p id="status" class="status">Loading…</p></section></main>
<script>
const eventEl=document.querySelector('#event'),actsEl=document.querySelector('#acts'),statusEl=document.querySelector('#status');let data={now_playing:{},events:[]},csrf=document.cookie.match(/(?:^|; )emom_staff_csrf=([^;]+)/)?.[1];
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function api(url,options={}){const method=(options.method||'GET').toUpperCase();options.credentials='same-origin';options.headers={...(options.headers||{}),'Content-Type':'application/json'};if(!['GET','HEAD'].includes(method))options.headers['X-CSRF-Token']=decodeURIComponent(csrf||'');const response=await fetch(url,options);const payload=await response.json().catch(()=>null);if(!response.ok)throw Error(payload?.error?.message||`Request failed (${response.status})`);if(!payload?.data)throw Error('The server returned an invalid response.');return payload.data}
function selectedEvent(){return data.events.find(event=>event.event_id===Number(eventEl.value))}
function render(){const event=selectedEvent(),liveId=data.now_playing.profile_id,performers=event?.performers||[];actsEl.innerHTML=performers.length?performers.map((performer,index)=>`<article class="row ${performer.profile_id===liveId?'live':''}" data-id="${performer.profile_id}"><span class="performer">${esc(performer.display_name)}${performer.profile_id===liveId?'<small>LIVE NOW</small>':performer.checked_in?'<small>Checked in</small>':'<small>Selected performer</small>'}</span><button class="check ${performer.checked_in?'checked':''}" type="button" data-check aria-label="${performer.checked_in?'Mark not arrived':'Mark arrived'}: ${esc(performer.display_name)}">${performer.checked_in?'✓':'○'}</button><button class="check now ${performer.profile_id===liveId?'active':''}" type="button" data-live ${performer.checked_in?'':'disabled'} aria-label="${performer.profile_id===liveId?'Clear now playing':'Set now playing'}: ${esc(performer.display_name)}">${performer.profile_id===liveId?'●':'○'}</button><span class="order"><button data-up ${index?'':'disabled'} aria-label="Move ${esc(performer.display_name)} up">↑</button><button data-down ${index<performers.length-1?'':'disabled'} aria-label="Move ${esc(performer.display_name)} down">↓</button></span></article>`).join(''):'<p class="empty">No selected performers or performance records for this event.</p>';actsEl.querySelectorAll('.row').forEach(row=>{const profileId=Number(row.dataset.id);row.querySelector('[data-check]').onclick=()=>saveRollCall(profileId);row.querySelector('[data-live]').onclick=()=>saveLive(profileId);row.querySelector('[data-up]').onclick=()=>move(profileId,-1);row.querySelector('[data-down]').onclick=()=>move(profileId,1)});}
async function move(profileId,direction){const event=selectedEvent(),ordered=[...event.performers],index=ordered.findIndex(item=>item.profile_id===profileId),swap=index+direction;if(index<0||swap<0||swap>=ordered.length)return;[ordered[index],ordered[swap]]=[ordered[swap],ordered[index]];try{const result=await api(`/api/v1/admin/live/events/${event.event_id}/performers/order`,{method:'PUT',body:JSON.stringify({profile_ids:ordered.map(item=>item.profile_id),moved_profile_id:profileId})});event.performers=result.performers;render()}catch(error){statusEl.textContent=error.message;statusEl.className='status error'}}
async function saveRollCall(profileId){const event=selectedEvent(),performer=event.performers.find(item=>item.profile_id===profileId);try{const result=await api(`/api/v1/admin/live/events/${event.event_id}/performers/${profileId}/roll-call`,{method:'PUT',body:JSON.stringify({checked_in:!performer.checked_in})});event.performers=result.performers;statusEl.textContent=performer.checked_in?'Arrival cleared.':'Performer checked in and added to the show order.';render()}catch(error){statusEl.textContent=error.message;statusEl.className='status error'}}
async function saveLive(profileId){const nextProfileId=data.now_playing.profile_id===profileId?null:profileId;try{data.now_playing=await api('/api/v1/admin/live/now-playing',{method:'PUT',body:JSON.stringify({event_id:Number(eventEl.value),profile_id:nextProfileId})});statusEl.textContent=nextProfileId?'Live performer updated.':'Now playing cleared.';render()}catch(error){statusEl.textContent=error.message;statusEl.className='status error'}}
async function refresh(initial=false){try{const previous=eventEl.value;data=await api('/api/v1/admin/live/now-playing');if(initial||!eventEl.options.length){eventEl.innerHTML=data.events.map(event=>`<option value="${event.event_id}">${esc(event.event_date)} — ${esc(event.event_name)}</option>`).join('');const hasLiveEvent=data.events.some(event=>event.event_id===data.now_playing.event_id);eventEl.value=(hasLiveEvent&&data.now_playing.event_id)||previous||data.events[0]?.event_id||'';eventEl.onchange=render}else if(previous&&data.events.some(event=>String(event.event_id)===previous))eventEl.value=previous;render()}catch(error){console.error('Stage manager refresh failed:',error);if(initial){statusEl.textContent=error.message;statusEl.className='status error'}}}
refresh(true);setInterval(()=>refresh(),5000);
</script></body></html>
