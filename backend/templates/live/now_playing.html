<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Now Playing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&display=swap" rel="stylesheet">
    <style>
        :root {
            --page-bg: #08131a;
            --panel-bg: rgba(7, 24, 33, .88);
            --border: rgba(255, 255, 255, .14);
            --text: #f5f7f8;
            --muted: rgba(245, 247, 248, .72);
            --accent: #63e6be;
            --accent-strong: #b9fbc0
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: "Afacad Flux", system-ui, sans-serif;
            color: var(--text);
            background: #000
        }

        .shell {
            min-height: 100vh;
            width: 100%;
            max-width: 100vw;
            display: grid;
            place-items: center;
            padding: 24px;
            overflow: hidden
        }

        .panel {
            width: min(980px, calc(100vw - 48px));
            min-width: 0;
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--artist-background, #0082eb);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .32);
            backdrop-filter: blur(14px);
            overflow: hidden;
            transition: background-color .55s ease
        }

        .panel-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px
        }

        .panel-header[hidden] {
            display: none
        }

        .heading {
            min-width: 0
        }

        .eyebrow {
            margin: 0;
            font-size: .85rem;
            letter-spacing: .24em;
            text-transform: uppercase;
            color: var(--muted)
        }

        h1 {
            margin: 4px 0 0;
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            line-height: .95
        }

        .current {
            min-height: 260px;
            width: 100%;
            min-width: 0;
            display: grid;
            place-items: center;
            padding: 36px 24px 16px;
            text-align: center;
            overflow: hidden
        }

        .current-label {
            margin: 0 0 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .18em;
            font-size: .78rem
        }

        .current-name {
            margin: 0;
            font-size: clamp(2.8rem, 7vw, 5.4rem);
            line-height: .95;
            color: #fff;
            white-space: nowrap;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow: hidden
        }

        .current-name.empty {
            color: var(--muted);
            font-style: italic
        }

        .display-screen[hidden] {
            display: none
        }

        .banner-screen {
            min-height: 430px;
            display: grid;
            place-items: center;
            gap: 24px;
            padding: 36px 24px;
            text-align: center
        }

        .banner-screen img {
            display: block;
            max-width: min(72vw, 520px);
            max-height: 190px;
            object-fit: contain
        }

        .banner-text {
            margin: 0;
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 1.05
        }

        .banner-qr {
            width: 150px;
            padding: 8px;
            background: #fff;
            border-radius: 12px
        }

        .banner-qr img {
            width: 100%;
            max-width: none;
            max-height: none
        }

        .jukebox-track {
            margin: 0;
            text-align: center;
            font-size: clamp(2rem, 6vw, 5rem);
            line-height: 1
        }

        .jukebox-artist {
            margin: 12px 0 0;
            text-align: center;
            color: var(--muted);
            font-size: clamp(1.2rem, 3vw, 2rem)
        }

        .artist-qr {
            width: 150px;
            padding: 8px;
            border-radius: 12px;
            background: #fff
        }

        .artist-qr img {
            display: block;
            width: 100%;
            height: auto
        }

        .program {
            margin-top: 24px;
            display: grid;
            gap: 12px
        }

        .program-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .08)
        }

        .program-item.active {
            background: rgba(99, 230, 190, .14);
            border-color: rgba(185, 251, 192, .3)
        }

        .program-index {
            font-size: .85rem;
            color: var(--muted);
            min-width: 2ch
        }

        .program-name {
            font-size: clamp(1.05rem, 2.4vw, 1.4rem)
        }

        .program-badge {
            color: var(--accent);
            font-size: .8rem;
            text-transform: uppercase;
            letter-spacing: .16em
        }

        .footer {
            margin-top: 24px;
            color: var(--muted);
            font-size: .95rem
        }

        @media(max-width:640px) {
            .panel {
                padding: 22px;
                border-radius: 22px
            }

            .program-item {
                grid-template-columns: auto 1fr
            }

            .program-badge {
                grid-column: 2
            }

            .artist-qr {
                width: 110px
            }

            .current {
                min-height: 190px;
                padding-top: 28px
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <section class="panel">
            <header class="panel-header">
                <div class="heading"><p id="event-date" class="eyebrow">EMOM Sydney{% if event %} · {{ event.event_date }}{% endif %}</p>
                    <h1>Now Playing</h1>
                </div>
                <div id="artist-qr"{% if not artist_qr_url %} hidden{% endif %}>{% if artist_qr_url %}<div class="artist-qr"><img src="{{ artist_qr_url }}" data-profile-id="{{ now_playing.profile_id }}" alt="QR code for {{ now_playing.text }}'s artist profile"></div>{% endif %}</div>
            </header>
            <section id="banner-screen" class="display-screen banner-screen">
                <img id="banner-logo"{% if banner.logo_url %} src="{{ banner.logo_url }}"{% endif %} alt="Sydney EMOM logo"{% if not banner.logo_url %} hidden{% endif %}>
                <p id="banner-text" class="banner-text">{{ banner.text }}</p>
                <div id="banner-qr" class="banner-qr"><img id="banner-qr-image"{% if banner.qr_url %} src="{{ banner.qr_url }}"{% endif %} alt="QR code for the Sydney EMOM website"></div>
            </section>
            <section id="current" class="display-screen current" hidden>
                {% if now_playing.text.strip() %}<p id="current-name" class="current-name" data-empty-label="- - -">{{
                    now_playing.text }}</p>{% else %}<p id="current-name" class="current-name empty" data-empty-label="- - -">- - -</p>{% endif %}
            </section>
            <section id="jukebox-screen" class="display-screen current" hidden>
                <div><p class="current-label">Now playing on the jukebox</p><p id="jukebox-track" class="jukebox-track"></p><p id="jukebox-artist" class="jukebox-artist"></p></div>
            </section>
        </section>
    </main>
    <script>
        var currentName = document.querySelector('#current-name');
        var current = document.querySelector('#current');
        var bannerScreen = document.querySelector('#banner-screen');
        var panelHeader = document.querySelector('.panel-header');
        var bannerLogo = document.querySelector('#banner-logo');
        var bannerText = document.querySelector('#banner-text');
        var bannerQr = document.querySelector('#banner-qr');
        var bannerQrImage = document.querySelector('#banner-qr-image');
        var jukeboxScreen = document.querySelector('#jukebox-screen');
        var jukeboxTrack = document.querySelector('#jukebox-track');
        var jukeboxArtist = document.querySelector('#jukebox-artist');
        var artistQr = document.querySelector('#artist-qr');
        var eventDate = document.querySelector('#event-date');
        var emptyLabel = currentName.getAttribute('data-empty-label') || '- - -';
        var artistColours = ['#0082eb', '#bd3971', '#6646b8'];
        var panel = document.querySelector('.panel');
        var activeArtistColour = '#0082eb';
        var lastArtistName = currentName.textContent.replace(/^\s+|\s+$/g, '');
        var bannerConfig = {display_time_secs: 30, display_interval_secs: 300, display_delay_secs: 60};
        var inactiveSince = null;
        var jukeboxStartedAt = null;
        var lastBannerAt = null;
        var bannerUntil = 0;

        function fitArtistName() {
            var availableWidth = currentName.clientWidth;
            if (availableWidth <= 0) return;
            var low = 1;
            var high = 88;
            while (low < high) {
                var middle = Math.ceil((low + high) / 2);
                currentName.style.fontSize = middle + 'px';
                if (currentName.scrollWidth <= availableWidth) low = middle;
                else high = middle - 1;
            }
            currentName.style.fontSize = `${low}px`;
        }

        function changeArtistColour() {
            var choices = [];
            var index;
            for (index = 0; index < artistColours.length; index += 1) {
                if (artistColours[index] !== activeArtistColour) choices.push(artistColours[index]);
            }
            activeArtistColour = choices[Math.floor(Math.random() * choices.length)];
            panel.style.setProperty('--artist-background', activeArtistColour);
        }

        function clearChildren(node) {
            while (node.firstChild) node.removeChild(node.firstChild);
        }

        function setScreen(screen) {
            bannerScreen.hidden = screen !== 'banner';
            current.hidden = screen !== 'performer';
            jukeboxScreen.hidden = screen !== 'jukebox';
            panelHeader.hidden = screen === 'banner';
        }

        function updateBanner(config) {
            bannerConfig = config || bannerConfig;
            bannerText.textContent = String(bannerConfig.text || '');
            bannerLogo.hidden = !bannerConfig.logo_url;
            if (bannerConfig.logo_url) bannerLogo.src = bannerConfig.logo_url;
            bannerQr.hidden = !bannerConfig.qr_url;
            if (bannerConfig.qr_url) bannerQrImage.src = bannerConfig.qr_url;
        }

        function showBanner(now) {
            setScreen('banner');
            lastBannerAt = now;
            bannerUntil = now + bannerConfig.display_time_secs * 1000;
        }

        function showPerformer() {
            setScreen('performer');
            inactiveSince = null;
            bannerUntil = 0;
        }

        function showJukebox(track) {
            setScreen('jukebox');
            inactiveSince = null;
            jukeboxTrack.textContent = String(track.title || '');
            jukeboxArtist.textContent = String(track.artist || '');
        }

        function showIdle(now) {
            if (!inactiveSince) inactiveSince = now;
            if (bannerScreen.hidden) showBanner(now);
            else setScreen('banner');
        }

        function isPlaying(payload) {
            var playback = payload && payload.data && payload.data.playback;
            var track = playback && playback.track;
            return payload && payload.data && payload.data.service && payload.data.service.status === 'ok'
                && playback && playback.state === 'playing' && track && String(track.title || '').trim()
                ? track : null;
        }

        function fetchJukebox(url) {
            if (!url) return Promise.resolve(null);
            return fetch(url, {cache: 'no-store', credentials: 'omit'}).then(function (response) {
                if (!response.ok) throw Error('jukebox request failed');
                return response.json();
            }).then(isPlaying).catch(function () { return null; });
        }

        function updateDisplay(state, jukeboxTrackState) {
            var now = Date.now();
            var performerName = String(state.text || '').replace(/^\s+|\s+$/g, '');
            if (performerName) {
                if (performerName !== lastArtistName) changeArtistColour();
                currentName.textContent = performerName;
                currentName.className = 'current-name';
                lastArtistName = performerName;
                showPerformer();
                return;
            }
            if (jukeboxTrackState) {
                if (!jukeboxStartedAt) {
                    jukeboxStartedAt = now;
                    lastBannerAt = now;
                }
                if (bannerUntil && now < bannerUntil) setScreen('banner');
                else if (now - lastBannerAt >= bannerConfig.display_interval_secs * 1000) showBanner(now);
                else showJukebox(jukeboxTrackState);
                return;
            }
            jukeboxStartedAt = null;
            showIdle(now);
        }

        function refreshNowPlaying() {
            var request = new XMLHttpRequest();
            request.open('GET', '/api/v1/live/now-playing?display=1', true);
            request.setRequestHeader('Cache-Control', 'no-cache');
            request.onreadystatechange = function () {
                if (request.readyState !== 4 || request.status < 200 || request.status >= 300) return;
                var payload;
                try {
                    payload = JSON.parse(request.responseText);
                } catch (error) {
                    return;
                }
                if (!payload || !payload.data || !payload.data.now_playing) return;
                var state = payload.data.now_playing;
                updateBanner(payload.data.banner);
                fitArtistName();
                eventDate.textContent = payload.data.event
                    ? 'EMOM Sydney · ' + payload.data.event.event_date
                    : 'EMOM Sydney';
                var qrUrl = payload.data.artist_qr_url;
                if (qrUrl) {
                    var existing = artistQr.querySelector('img');
                    var profileId = String(state.profile_id);
                    var versionedQrUrl = qrUrl + (qrUrl.indexOf('?') !== -1 ? '&' : '?') + 'live=' + encodeURIComponent(profileId);
                    if (!existing || existing.getAttribute('data-profile-id') !== profileId) {
                        var frame = document.createElement('div');
                        var image = document.createElement('img');
                        frame.className = 'artist-qr';
                        image.src = versionedQrUrl;
                        image.setAttribute('data-profile-id', profileId);
                        image.alt = 'QR code for ' + String(state.text || 'the artist') + "'s artist profile";
                        frame.appendChild(image);
                        clearChildren(artistQr);
                        artistQr.appendChild(frame);
                    }
                    artistQr.hidden = false;
                } else {
                    artistQr.hidden = true;
                    clearChildren(artistQr);
                }
                fetchJukebox(payload.data.banner && payload.data.banner.jukebox_url).then(function (track) {
                    updateDisplay(state, track);
                    fitArtistName();
                });
            };
            request.send(null);
        }

        updateBanner({text: bannerText.textContent, logo_url: bannerLogo.getAttribute('src'), qr_url: bannerQrImage.getAttribute('src'), display_time_secs: {{ banner.display_time_secs }}, display_interval_secs: {{ banner.display_interval_secs }}, display_delay_secs: {{ banner.display_delay_secs }}, jukebox_url: {{ banner.jukebox_url|tojson }} });
        setScreen('banner');
        fitArtistName();
        window.addEventListener('resize', fitArtistName);
        setInterval(refreshNowPlaying, 5000);
    </script>
</body>

</html>
