<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Now Playing</title>
    <style>
        :root {
            --page-bg: #08131a;
            --panel-bg: rgba(7, 24, 33, .88);
            --border: rgba(255, 255, 255, .14);
            --text: #f5f7f8;
            --muted: rgba(245, 247, 248, .72);
            --accent: #63e6be;
            --accent-strong: #b9fbc0
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--text);
            background: radial-gradient(circle at top, rgba(43, 111, 140, .35), transparent 38%), linear-gradient(180deg, #123040 0%, var(--page-bg) 100%)
        }

        .shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px
        }

        .panel {
            width: min(980px, 100%);
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--panel-bg);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .32);
            backdrop-filter: blur(14px)
        }

        .eyebrow {
            margin: 0;
            font-size: .85rem;
            letter-spacing: .24em;
            text-transform: uppercase;
            color: var(--muted)
        }

        h1 {
            margin: 4px 0 28px;
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            line-height: .95
        }

        .current {
            padding: 24px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(99, 230, 190, .18), rgba(255, 255, 255, .03));
            border: 1px solid rgba(185, 251, 192, .22)
        }

        .current-label {
            margin: 0 0 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .18em;
            font-size: .78rem
        }

        .current-name {
            margin: 0;
            font-size: clamp(2.8rem, 7vw, 5.4rem);
            line-height: .95;
            color: var(--accent-strong);
            text-wrap: balance
        }

        .current-name.empty {
            color: var(--muted);
            font-style: italic
        }

        .artist-qr {
            width: min(220px, 58vw);
            margin: 24px auto 0;
            padding: 12px;
            border-radius: 14px;
            background: #fff
        }

        .artist-qr img {
            display: block;
            width: 100%;
            height: auto
        }

        .program {
            margin-top: 24px;
            display: grid;
            gap: 12px
        }

        .program-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .08)
        }

        .program-item.active {
            background: rgba(99, 230, 190, .14);
            border-color: rgba(185, 251, 192, .3)
        }

        .program-index {
            font-size: .85rem;
            color: var(--muted);
            min-width: 2ch
        }

        .program-name {
            font-size: clamp(1.05rem, 2.4vw, 1.4rem)
        }

        .program-badge {
            color: var(--accent);
            font-size: .8rem;
            text-transform: uppercase;
            letter-spacing: .16em
        }

        .footer {
            margin-top: 24px;
            color: var(--muted);
            font-size: .95rem
        }

        @media(max-width:640px) {
            .panel {
                padding: 22px;
                border-radius: 22px
            }

            .program-item {
                grid-template-columns: auto 1fr
            }

            .program-badge {
                grid-column: 2
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <section class="panel">
            <p class="eyebrow">EMOM Sydney{% if event %} · {{ event.event_date }}{% endif %}</p>
            <h1>Now Playing</h1>
            <section class="current">
                {% if now_playing.text.strip() %}<p id="current-name" class="current-name">{{
                    now_playing.text }}</p>{% else %}<p id="current-name" class="current-name empty">No act selected</p>{% endif %}
                <div id="artist-qr"{% if not artist_qr_url %} hidden{% endif %}>{% if artist_qr_url %}<div class="artist-qr"><img src="{{ artist_qr_url }}" alt="QR code for {{ now_playing.text }}'s artist profile"></div>{% endif %}</div>
            </section>
    </main>
    <script>
        const currentName = document.querySelector('#current-name');
        const artistQr = document.querySelector('#artist-qr');

        async function refreshNowPlaying() {
            try {
                const response = await fetch('/api/v1/live/now-playing', { cache: 'no-store' });
                const payload = await response.json();
                if (!response.ok || !payload.data) return;
                const state = payload.data.now_playing;
                const name = state.text.trim();
                currentName.textContent = name || 'No act selected';
                currentName.classList.toggle('empty', !name);
                const qrUrl = payload.data.artist_qr_url;
                if (qrUrl) {
                    const existing = artistQr.querySelector('img');
                    if (!existing || existing.getAttribute('src') !== qrUrl) {
                        const frame = document.createElement('div');
                        const image = document.createElement('img');
                        frame.className = 'artist-qr';
                        image.src = qrUrl;
                        image.alt = `QR code for ${name}'s artist profile`;
                        frame.append(image);
                        artistQr.replaceChildren(frame);
                    }
                    artistQr.hidden = false;
                } else {
                    artistQr.hidden = true;
                    artistQr.replaceChildren();
                }
            } catch (error) {
                console.warn('Unable to refresh now playing.', error);
            }
        }

        setInterval(refreshNowPlaying, 5000);
    </script>
</body>

</html>
