<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Now Playing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --page-bg: #08131a;
            --panel-bg: rgba(7, 24, 33, .88);
            --border: rgba(255, 255, 255, .14);
            --text: #f5f7f8;
            --muted: rgba(245, 247, 248, .72);
            --accent: #63e6be;
            --accent-strong: #b9fbc0
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: "Afacad Flux", system-ui, sans-serif;
            color: var(--text);
            background: #000
        }

        .shell {
            min-height: 100vh;
            width: 100%;
            max-width: 100vw;
            display: grid;
            place-items: center;
            padding: 24px;
            overflow: hidden
        }

        .panel {
            width: min(980px, calc(100vw - 48px));
            min-width: 0;
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--artist-background, #0082eb);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .32);
            backdrop-filter: blur(14px);
            overflow: hidden;
            transition: background-color .55s ease
        }

        .panel-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px
        }

        .heading {
            min-width: 0
        }

        .eyebrow {
            margin: 0;
            font-size: .85rem;
            letter-spacing: .24em;
            text-transform: uppercase;
            color: var(--muted)
        }

        h1 {
            margin: 4px 0 0;
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            line-height: .95
        }

        .current {
            min-height: 260px;
            width: 100%;
            min-width: 0;
            display: grid;
            place-items: center;
            padding: 36px 24px 16px;
            text-align: center;
            overflow: hidden
        }

        .current-label {
            margin: 0 0 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .18em;
            font-size: .78rem
        }

        .current-name {
            margin: 0;
            font-size: clamp(2.8rem, 7vw, 5.4rem);
            line-height: .95;
            color: #fff;
            white-space: nowrap;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow: hidden
        }

        .current-name.empty {
            color: var(--muted);
            font-style: italic
        }

        .artist-qr {
            width: 150px;
            padding: 8px;
            border-radius: 12px;
            background: #fff
        }

        .artist-qr img {
            display: block;
            width: 100%;
            height: auto
        }

        .program {
            margin-top: 24px;
            display: grid;
            gap: 12px
        }

        .program-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .08)
        }

        .program-item.active {
            background: rgba(99, 230, 190, .14);
            border-color: rgba(185, 251, 192, .3)
        }

        .program-index {
            font-size: .85rem;
            color: var(--muted);
            min-width: 2ch
        }

        .program-name {
            font-size: clamp(1.05rem, 2.4vw, 1.4rem)
        }

        .program-badge {
            color: var(--accent);
            font-size: .8rem;
            text-transform: uppercase;
            letter-spacing: .16em
        }

        .footer {
            margin-top: 24px;
            color: var(--muted);
            font-size: .95rem
        }

        @media(max-width:640px) {
            .panel {
                padding: 22px;
                border-radius: 22px
            }

            .program-item {
                grid-template-columns: auto 1fr
            }

            .program-badge {
                grid-column: 2
            }

            .artist-qr {
                width: 110px
            }

            .current {
                min-height: 190px;
                padding-top: 28px
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <section class="panel">
            <header class="panel-header">
                <div class="heading"><p id="event-date" class="eyebrow">EMOM Sydney{% if event %} · {{ event.event_date }}{% endif %}</p>
                    <h1>Now Playing</h1>
                </div>
                <div id="artist-qr"{% if not artist_qr_url %} hidden{% endif %}>{% if artist_qr_url %}<div class="artist-qr"><img src="{{ artist_qr_url }}" alt="QR code for {{ now_playing.text }}'s artist profile"></div>{% endif %}</div>
            </header>
            <section id="current" class="current">
                {% if now_playing.text.strip() %}<p id="current-name" class="current-name" data-empty-label="- - -">{{
                    now_playing.text }}</p>{% else %}<p id="current-name" class="current-name empty" data-empty-label="- - -">- - -</p>{% endif %}
            </section>
    </main>
    <script>
        const currentName = document.querySelector('#current-name');
        const current = document.querySelector('#current');
        const artistQr = document.querySelector('#artist-qr');
        const eventDate = document.querySelector('#event-date');
        const emptyLabel = currentName.dataset.emptyLabel || '- - -';
        const artistColours = ['#0082eb', '#bd3971', '#6646b8'];
        const panel = document.querySelector('.panel');
        let activeArtistColour = '#0082eb';
        let lastArtistName = currentName.textContent.trim();

        function fitArtistName() {
            const availableWidth = currentName.clientWidth;
            if (availableWidth <= 0) return;
            let low = 1;
            let high = 88;
            while (low < high) {
                const middle = Math.ceil((low + high) / 2);
                currentName.style.fontSize = `${middle}px`;
                if (currentName.scrollWidth <= availableWidth) low = middle;
                else high = middle - 1;
            }
            currentName.style.fontSize = `${low}px`;
        }

        function changeArtistColour() {
            const choices = artistColours.filter(colour => colour !== activeArtistColour);
            activeArtistColour = choices[Math.floor(Math.random() * choices.length)];
            panel.style.setProperty('--artist-background', activeArtistColour);
        }

        async function refreshNowPlaying() {
            try {
                const response = await fetch('/api/v1/live/now-playing', { cache: 'no-store' });
                const payload = await response.json();
                if (!response.ok || !payload.data) return;
                const state = payload.data.now_playing;
                const name = state.text.trim();
                if (name && name !== lastArtistName) changeArtistColour();
                currentName.textContent = name || emptyLabel;
                currentName.classList.toggle('empty', !name);
                lastArtistName = name;
                fitArtistName();
                eventDate.textContent = payload.data.event
                    ? `EMOM Sydney · ${payload.data.event.event_date}`
                    : 'EMOM Sydney';
                const qrUrl = payload.data.artist_qr_url;
                if (qrUrl) {
                    const existing = artistQr.querySelector('img');
                    const profileId = String(state.profile_id);
                    const versionedQrUrl = `${qrUrl}${qrUrl.includes('?') ? '&' : '?'}live=${encodeURIComponent(profileId)}`;
                    if (!existing || existing.dataset.profileId !== profileId) {
                        const frame = document.createElement('div');
                        const image = document.createElement('img');
                        frame.className = 'artist-qr';
                        image.src = versionedQrUrl;
                        image.dataset.profileId = profileId;
                        image.alt = `QR code for ${name}'s artist profile`;
                        frame.append(image);
                        artistQr.replaceChildren(frame);
                    }
                    artistQr.hidden = false;
                } else {
                    artistQr.hidden = true;
                    artistQr.replaceChildren();
                }
            } catch (error) {
                console.warn('Unable to refresh now playing.', error);
            }
        }

        document.fonts?.ready.then(fitArtistName);
        new ResizeObserver(fitArtistName).observe(current);
        fitArtistName();
        setInterval(refreshNowPlaying, 5000);
    </script>
</body>

</html>
